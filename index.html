<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SCRATCH</title>
    <meta name="description" content="SCRATCH — a PS1-flavoured billiards roguelike where the table fights back. Plus a completely normal game of 8-ball, if you ask nicely." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23111'/%3E%3Ccircle cx='8' cy='8' r='3.5' fill='%23f4f0e0'/%3E%3Ctext x='8' y='10.5' font-size='6' text-anchor='middle' font-family='monospace' font-weight='bold'%3E8%3C/text%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; background: #07050f; overflow: hidden; height: 100%; }
      #boot { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, #1a1030 0%, #07050f 70%); color: #8a86a8; font: 12px/1.6 monospace; letter-spacing: 0.2em; transition: opacity 0.45s; }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot .logo { font: italic 900 clamp(40px, 9vw, 96px) 'Arial Black', Impact, sans-serif; letter-spacing: -0.02em; transform: skewX(-10deg); background: linear-gradient(180deg, #fff 0%, #d8e8ff 38%, #6a78c8 48%, #1a1040 52%, #7c5cff 70%, #fff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(3px 3px 0 #000); }
      #boot .bar { width: min(320px, 60vw); height: 4px; background: #1a1432; margin: 22px 0 14px; overflow: hidden; }
      #boot .bar i { display: block; height: 100%; width: 30%; background: linear-gradient(90deg, #ff2bd6, #2bf0ff); animation: bootbar 1.1s ease-in-out infinite; }
      #boot .tip { min-height: 1.6em; color: #2bf0ff; opacity: 0; transition: opacity 0.4s; text-align: center; padding: 0 16px; }
      #boot .tip.on { opacity: 1; }
      #boot .err { max-width: 520px; color: #ffb0b8; text-align: center; letter-spacing: 0.05em; line-height: 1.8; padding: 0 20px; }
      @keyframes bootbar { 0% { transform: translateX(-110%); } 100% { transform: translateX(360%); } }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <div id="boot"><div class="logo">SCRATCH</div><div class="bar"><i></i></div><div class="tip"></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
